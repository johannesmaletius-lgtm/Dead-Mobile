<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06070c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dead Mobile">
<link rel="apple-touch-icon" id="appIcon">
<link rel="icon" id="favIcon">
<title>Dead Mobile</title>
<meta name="description" content="Ein Polizist, eine verlassene Schule, ein geschminkter Killer. Aufgaben erledigen, unentdeckt bleiben, durchs Tor entkommen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@700&family=Special+Elite&display=swap">
<link rel="stylesheet" href="css/style.css">

<canvas id="c" aria-label="Spielfeld"></canvas>
<div id="safe"></div>

<button id="pauseBtn" class="rnd" hidden aria-label="Pause">
  <svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>
</button>
<div id="tutCard" hidden role="status" aria-live="polite">
  <div class="thead"><div id="tutStep" class="tstep"></div><button id="tutSkip" class="skip">Überspringen ›</button></div>
  <p id="tutText"></p>
  <div class="row" id="tutGoRow" hidden><button id="tutGo" class="pill gold">Los geht’s</button></div>
</div>

<section id="title" class="screen">
  <h1 class="logo">Dead <span class="red">Mobile</span></h1>
  <svg class="smear" viewBox="0 0 440 34" aria-hidden="true"><path d="M8 12c60 14 140 20 214 16 76-4 150-14 210-24-40 16-92 26-150 30-80 6-170 2-274-22z" fill="#c3121f"/><path d="M60 22c20 2 26 8 24 12M300 25c4 3 5 6 4 9" stroke="#8e0f16" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
  <button id="play" class="btn" aria-label="Spielen"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
  <div class="row"><button id="tutBtn" class="pill">Tutorial</button><button id="teamBtn" class="pill">Team</button></div>
  <div id="best" class="best" hidden></div>
  <button id="sndT" class="rnd" aria-label="Ton an oder aus"></button>
</section>

<section id="pause" class="screen" hidden>
  <div class="row">
    <button id="resume" class="btn" aria-label="Weiter"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
    <button id="restart" class="btn" aria-label="Neu starten"><svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 1-7.7 5.9l1.9.6A6 6 0 1 0 12 6v3L7 5l5-4z"/></svg></button>
    <button id="leaveP" class="btn" hidden aria-label="Zum Menü"><svg viewBox="0 0 24 24"><path d="M4 3h10v2H6v14h8v2H4zM15.5 7.5 20 12l-4.5 4.5V13.5H9v-3h6.5z"/></svg></button>
  </div>
  <button id="sndP" class="rnd" aria-label="Ton an oder aus"></button>
</section>

<div id="rotate" role="alert">
  <h2 class="logo">Dead <span class="red">Mobile</span></h2>
  <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="15" y="5" width="18" height="38" rx="3.5"/><path d="M21 9h6M22.5 39h3"/><path d="M38 30a14 14 0 0 1-8 10" stroke="#c3121f"/><path d="M29 36.5l1 3.8-3.8 1" stroke="#c3121f"/></svg>
  <p>Dreh dein Handy quer</p>
</div>

<section id="end" class="screen" hidden>
  <h2 id="endWord" class="logo"></h2>
  <div class="sum"><div class="grade"><b id="grade"></b><span id="score"></span></div><div id="sgrid" class="sgrid"></div></div>
  <div id="endStats" class="stats"></div>
  <div id="endBest" class="best" hidden></div>
  <button id="again" class="btn" aria-label="Nochmal"><svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 1-7.7 5.9l1.9.6A6 6 0 1 0 12 6v3L7 5l5-4z"/></svg></button>
  <button id="endLeave" class="pill back" hidden><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span>Menü</span></button>
</section>

<!-- Team-Menü und Lobby (js/lobby.js) -->
<section id="team" class="screen lob" hidden aria-labelledby="teamH">
  <button id="teamBack" class="pill back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span>Zurück</span></button>
  <div class="lin">
  <h2 id="teamH" class="logo sub">Team</h2>
  <div class="lgrid">
    <div class="panel who">
      <label class="lbl" for="tName">Dein Name</label>
      <input id="tName" class="field" maxlength="14" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done">
      <div class="lbl">Deine Figur</div>
      <div id="tSkins" class="skins" role="radiogroup" aria-label="Deine Figur"></div>
    </div>
    <div class="panel acts">
      <div id="tMaps" class="maps" hidden></div>
      <button id="tBots" class="pill gold">Mit Bots spielen</button>
      <button id="tHost" class="pill">Raum erstellen</button>
      <div class="or"><span>oder beitreten</span></div>
      <div class="joinrow">
        <input id="tCode" class="field code" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" aria-label="Raumcode">
        <button id="tJoin" class="pill">Beitreten</button>
      </div>
    </div>
  </div>
  <p id="tMsg" class="nmsg" role="status" aria-live="polite"></p>
  </div>
</section>

<section id="room" class="screen lob" hidden aria-labelledby="rCodeLbl">
  <button id="roomBack" class="pill back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span>Verlassen</span></button>
  <div class="lin">
  <div class="lgrid">
    <div class="panel rinfo">
      <div id="rCodeLbl" class="lbl">Raumcode</div>
      <div id="rCode" class="bigcode" title="Zum Kopieren antippen"></div>
      <p id="rHint" class="hint"></p>
      <div class="lbl">Karte</div>
      <div id="rMaps" class="maps"></div>
    </div>
    <div class="panel rplay">
      <div class="lbl">Spieler <span id="rCount"></span></div>
      <ol id="rList" class="plist"></ol>
      <button id="rStart" class="pill gold">Starten</button>
      <p id="rWait" class="wait">Warte auf den Host</p>
    </div>
  </div>
  </div>
</section>
<div id="notice" role="alert" hidden></div>
<!-- Reihenfolge wichtig: klassische Skripte teilen sich den globalen Gültigkeitsbereich (läuft auch per file://). -->
<script src="js/core.js"></script>
<script src="js/maps/schule.js"></script>
<script src="js/map.js"></script>
<script src="js/audio.js"></script>
<script src="js/state.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/survivor.js"></script>
<script src="js/tasks.js"></script>
<script src="js/killer.js"></script>
<script src="js/flow.js"></script>
<script src="js/render.js"></script>
<script src="js/figures.js"></script>
<script src="js/tiles.js"></script>
<script src="js/light.js"></script>
<script src="js/hud.js"></script>
<script src="js/net.js"></script>
<script src="js/lobby.js"></script>
<script src="js/main.js"></script>

</body></html>
